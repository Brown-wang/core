<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts 距离路线图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f2f5;
      font-family: 'Microsoft YaHei', Arial, sans-serif;
    }
    #chart-container {
      width: 1050px;
      height: 220px;
      background: linear-gradient(180deg, #eaf6fb 0%, #e2f1f8 100%);
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div id="chart-container"></div>
  <script>
    const chartDom = document.getElementById('chart-container');
    const chart = echarts.init(chartDom);

    // SVG path: 向右的三角箭头
    const arrowRight = 'path://M0,-8 L14,0 L0,8 Z';

    // SVG path: 定位 pin 图标
    const pinIcon = 'path://M12,0 C5.37,0 0,5.37 0,12 c0,9 12,20 12,20 s12,-11 12,-20 C24,5.37 18.63,0 12,0 Z M12,17 c-2.76,0 -5,-2.24 -5,-5 s2.24,-5 5,-5 s5,2.24 5,5 S14.76,17 12,17 Z';

    const option = {
      backgroundColor: 'transparent',
      grid: {
        left: 55,
        right: 55,
        top: 55,
        bottom: 65
      },
      xAxis: {
        type: 'value',
        min: 0,
        max: 100,
        interval: 10,
        position: 'top',
        axisLine: {
          show: true,
          lineStyle: {
            color: '#c0cdd6',
            width: 1
          }
        },
        axisTick: {
          show: true,
          length: 5,
          lineStyle: {
            color: '#c0cdd6'
          }
        },
        axisLabel: {
          color: '#8a9baa',
          fontSize: 12,
          margin: 8,
          formatter: function (value) {
            if (value === 100) return '100km';
            return value;
          }
        },
        splitLine: {
          show: false
        }
      },
      yAxis: {
        type: 'value',
        show: false,
        min: -2,
        max: 3
      },
      series: [
        // ========== 主路线（底层蓝色线） ==========
        {
          type: 'line',
          data: [[0, 0], [100, 0]],
          lineStyle: {
            color: {
              type: 'linear',
              x: 0, y: 0, x2: 1, y2: 0,
              colorStops: [
                { offset: 0, color: '#2bce6b' },
                { offset: 0.08, color: '#34b8f0' },
                { offset: 0.92, color: '#34b8f0' },
                { offset: 1, color: '#2bce6b' }
              ]
            },
            width: 5
          },
          symbol: 'none',
          z: 2,
          silent: true
        },

        // ========== 起点绿色箭头 ==========
        {
          type: 'scatter',
          data: [[1.5, 0]],
          symbol: arrowRight,
          symbolSize: [18, 18],
          symbolRotate: 0,
          itemStyle: {
            color: '#22c55e'
          },
          z: 10,
          silent: true
        },

        // ========== 起点标签 "0.0000km" ==========
        {
          type: 'scatter',
          data: [[0, 0]],
          symbol: 'none',
          label: {
            show: true,
            position: [0, -55],
            formatter: '0.0000km',
            color: '#fff',
            fontSize: 12,
            fontWeight: 'bold',
            backgroundColor: '#22c55e',
            borderRadius: 4,
            padding: [5, 10]
          },
          z: 20
        },

        // ========== 终点绿色箭头 ==========
        {
          type: 'scatter',
          data: [[98.5, 0]],
          symbol: arrowRight,
          symbolSize: [18, 18],
          symbolRotate: 0,
          itemStyle: {
            color: '#22c55e'
          },
          z: 10,
          silent: true
        },

        // ========== 终点标签 "99.2226km" ==========
        {
          type: 'scatter',
          data: [[99.2226, 0]],
          symbol: 'none',
          label: {
            show: true,
            position: [-80, -55],
            formatter: '99.2226km',
            color: '#fff',
            fontSize: 12,
            fontWeight: 'bold',
            backgroundColor: '#22c55e',
            borderRadius: 4,
            padding: [5, 10]
          },
          z: 20
        },

        // ========== 中间蓝色定位 pin ==========
        {
          type: 'scatter',
          data: [[51.9638, 0]],
          symbol: pinIcon,
          symbolSize: [24, 32],
          symbolOffset: [0, '-50%'],
          itemStyle: {
            color: '#3baaf0',
            borderColor: '#fff',
            borderWidth: 0
          },
          z: 15,
          silent: true
        },

        // ========== 中间标签 "51.9638km"（蓝色背景） ==========
        {
          type: 'scatter',
          data: [[51.9638, 0]],
          symbol: 'none',
          label: {
            show: true,
            position: [-40, -80],
            formatter: '51.9638km',
            color: '#fff',
            fontSize: 12,
            fontWeight: 'bold',
            backgroundColor: '#3baaf0',
            borderRadius: 4,
            padding: [5, 10]
          },
          z: 20
        },

        // ========== "99.2226km" 小文字标注（蓝色文字，在 pin 下方） ==========
        {
          type: 'scatter',
          data: [[51.9638, 0]],
          symbol: 'none',
          label: {
            show: true,
            position: [-30, 15],
            formatter: '99.2226km',
            color: '#3baaf0',
            fontSize: 11,
            fontWeight: 'normal'
          },
          z: 20
        }
      ],
      animation: true,
      animationDuration: 1200,
      animationEasing: 'cubicOut'
    };

    chart.setOption(option);

    window.addEventListener('resize', function () {
      chart.resize();
    });
  </script>
</body>
</html>
